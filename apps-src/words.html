<div class="app-panel" id="words" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Amount in Words (₹)</h2><p class="sub">Write an amount in Indian words (lakh, crore) for cheques, invoices and vouchers.</p>
  <div class="fld"><label for="wdAmt">AMOUNT (₹)</label><input id="wdAmt" type="number" inputmode="decimal" min="0" max="99999999999" step="0.01" value="125430.50"></div>
  <p class="note">Works up to ₹99,999,999,999.99 (9,999 crore). Paise are rounded to two decimals.</p></div>
  <div class="app-card glass-card result"><div class="big-result"><small>IN WORDS</small><strong id="wdOut" style="font-size:20px;line-height:1.4">—</strong></div>
  <div class="kv"><div><span>Indian format</span><b id="wdFmt">—</b></div></div>
  <div class="copy-row"><button type="button" id="wdCopy">⧉ Copy words</button></div></div>
</div></div>
