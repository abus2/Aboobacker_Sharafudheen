<div class="app-panel" id="invoice" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Invoice Generator</h2><p class="sub">Line items, GST and a printable total.</p>
  <div class="add-row"><div class="fld"><label for="ivFrom">FROM (YOUR NAME)</label><input id="ivFrom" type="text" maxlength="40" value="Aboobacker"></div><div class="fld"><label for="ivTo">BILL TO</label><input id="ivTo" type="text" maxlength="40" value="Customer"></div></div><div class="add-row"><div class="fld"><label for="ivNo">INVOICE NO.</label><input id="ivNo" type="text" maxlength="20" value="INV-001"></div><div class="fld"><label for="ivGst">GST (%)</label><input id="ivGst" type="number" inputmode="decimal" min="0" step="any" value="18"></div></div><div class="fld"><label>ITEMS · DESCRIPTION / QTY / RATE (₹)</label><div class="inv-row"><input id="ivD1" type="text" maxlength="40" placeholder="Item 1" value="Notebook" aria-label="Item 1"><input id="ivQ1" type="number" min="0" step="any" value="10" aria-label="Qty 1"><input id="ivR1" type="number" min="0" step="any" value="60" aria-label="Rate 1"></div><div class="inv-row"><input id="ivD2" type="text" maxlength="40" placeholder="Item 2" value="Pen box" aria-label="Item 2"><input id="ivQ2" type="number" min="0" step="any" value="5" aria-label="Qty 2"><input id="ivR2" type="number" min="0" step="any" value="120" aria-label="Rate 2"></div><div class="inv-row"><input id="ivD3" type="text" maxlength="40" placeholder="Item 3" value="" aria-label="Item 3"><input id="ivQ3" type="number" min="0" step="any" value="0" aria-label="Qty 3"><input id="ivR3" type="number" min="0" step="any" value="0" aria-label="Rate 3"></div><div class="inv-row"><input id="ivD4" type="text" maxlength="40" placeholder="Item 4" value="" aria-label="Item 4"><input id="ivQ4" type="number" min="0" step="any" value="0" aria-label="Qty 4"><input id="ivR4" type="number" min="0" step="any" value="0" aria-label="Rate 4"></div></div><div class="copy-row"><button type="button" id="ivCopy">⧉ Copy invoice</button><button type="button" id="ivPrint">⎙ Print</button></div></div>
  <div class="app-card glass-card result"><div class="big-result"><small>INVOICE TOTAL</small><strong id="ivBig">0</strong></div><div class="kv"><div><span>Subtotal</span><b id="ivSub">—</b></div><div><span>GST</span><b id="ivTax">—</b></div><div><span>CGST (half)</span><b id="ivC">—</b></div><div><span>SGST (half)</span><b id="ivS">—</b></div></div><div class="chart-box" id="ivText" style="white-space:pre-wrap;font-size:12px;line-height:1.7"></div></div>
</div></div>
