<div class="app-panel" id="split" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Bill Split &amp; Tip</h2><p class="sub">Add a tip and divide the bill between people.</p>

  <div class="app-card glass-card result"><div class="big-result"><small>EACH PERSON PAYS</small><strong id="spBig">0</strong></div><div class="kv"><div><span>Tip amount</span><b id="spTipAmt">—</b></div><div><span>Total with tip</span><b id="spTotal">—</b></div><div><span>Tip per person</span><b id="spTipEach">—</b></div></div></div>
</div></div>
