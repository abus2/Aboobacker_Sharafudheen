<div class="app-panel" id="tally" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Accounts Book (Tally-style)</h2><p class="sub">Double-entry vouchers, day book, ledgers and trial balance. Saved only in this browser.</p>
  <div class="fld"><label>VOUCHER TYPE</label><div class="seg" id="tyType"><button type="button" class="active" data-v="Receipt">Receipt</button><button type="button" data-v="Payment">Payment</button><button type="button" data-v="Sales">Sales</button><button type="button" data-v="Purchase">Purchase</button><button type="button" data-v="Journal">Journal</button></div></div><div class="fld"><label for="tyDate">DATE</label><input id="tyDate" type="date"  value=""></div><div class="add-row"><div class="fld"><label for="tyDr">DEBIT (Dr) LEDGER</label><input id="tyDr" type="text" list="tyList" maxlength="40" placeholder="e.g. Cash" value=""></div><div class="fld"><label for="tyCr">CREDIT (Cr) LEDGER</label><input id="tyCr" type="text" list="tyList" maxlength="40" placeholder="e.g. Sales" value=""></div></div><datalist id="tyList"></datalist><div class="add-row"><div class="fld"><label for="tyAmt">AMOUNT (₹)</label><input id="tyAmt" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value=""></div><div class="fld"><label for="tyNar">NARRATION</label><input id="tyNar" type="text" maxlength="60" placeholder="optional" value=""></div></div><button class="button" type="button" id="tySave">Save voucher ＋</button><div class="copy-row" style="margin-top:16px"><button type="button" id="tyCsv">⇩ Export CSV</button><button type="button" id="tyClear">Clear all</button></div><p class="note" style="margin-top:14px">Every voucher debits one ledger and credits another by the same amount. An independent learning tool, not affiliated with or a replacement for Tally Solutions’ software.</p></div>
  <div class="app-card glass-card result"><div class="seg" id="tyView"><button type="button" class="active" data-v="Day Book">Day Book</button><button type="button" data-v="Ledger">Ledger</button><button type="button" data-v="Trial Balance">Trial Balance</button></div><div class="fld" id="tyLedBox" hidden><label for="tyLed">LEDGER</label><select id="tyLed"></select></div><div id="tyOut"></div></div>
</div></div>
