<div class="app-panel" id="percent" role="tabpanel"><div class="app-grid">
        <div class="app-card glass-card"><h2>Percentage Calculator</h2><p class="sub">Three everyday calculations in one place.</p>
          <div class="fld"><label>1 · WHAT IS X% OF Y?</label><div class="add-row"><input id="pcA" type="number" inputmode="decimal" step="any" value="15" aria-label="Percent"><input id="pcB" type="number" inputmode="decimal" step="any" value="2400" aria-label="Number"></div></div>
          <div class="fld"><label>2 · CHANGE FROM → TO</label><div class="add-row"><input id="pcFrom" type="number" inputmode="decimal" step="any" value="800" aria-label="From"><input id="pcTo" type="number" inputmode="decimal" step="any" value="1000" aria-label="To"></div></div>
          <div class="fld"><label>3 · PRICE, DISCOUNT % AND TAX %</label><div class="add-row"><input id="pcPrice" type="number" inputmode="decimal" step="any" value="2000" aria-label="Price"><input id="pcDisc" type="number" inputmode="decimal" step="any" value="20" aria-label="Discount percent"></div><input id="pcTax" type="number" inputmode="decimal" step="any" value="18" aria-label="Tax percent" style="margin-top:10px"></div></div>
        <div class="app-card glass-card result"><div class="big-result"><small id="pcL1">15% OF 2,400</small><strong id="pc1">0</strong></div>
          <div class="kv"><div><span>Change</span><b id="pcChg">0</b></div><div><span>Percentage change</span><b id="pcPct">0%</b></div></div>
          <div class="kv"><div><span>Discount amount</span><b id="pcDiscAmt">₹0</b></div><div><span>Price after discount</span><b id="pcAfter">₹0</b></div><div><span>Tax on discounted price</span><b id="pcTaxAmt">₹0</b></div><div><span>Final price</span><b id="pcFinal">₹0</b></div></div></div>
      </div></div>
