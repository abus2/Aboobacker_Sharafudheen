<div class="app-panel" id="trip" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Trip Fuel Cost</h2><p class="sub">Estimate fuel and cost for a journey.</p>
  <div class="fld"><label for="trD">DISTANCE (km)</label><input id="trD" type="number" inputmode="decimal" min="0" step="any" value="250"></div><div class="add-row"><div class="fld"><label for="trM">MILEAGE (km per litre)</label><input id="trM" type="number" inputmode="decimal" min="0" step="any" value="15"></div><div class="fld"><label for="trP">FUEL PRICE (₹ per litre)</label><input id="trP" type="number" inputmode="decimal" min="0" step="any" value="100"></div></div><div class="fld"><label for="trN">PEOPLE SHARING</label><input id="trN" type="number" inputmode="decimal" min="0" step="any" value="2"></div></div>
  <div class="app-card glass-card result"><div class="big-result"><small>TRIP FUEL COST</small><strong id="trBig">0</strong></div><div class="kv"><div><span>Fuel needed</span><b id="trL">—</b></div><div><span>Cost per km</span><b id="trKm">—</b></div><div><span>Cost per person</span><b id="trEach">—</b></div></div></div>
</div></div>
