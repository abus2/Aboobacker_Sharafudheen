<div class="app-panel" id="cagr" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>CAGR Calculator</h2><p class="sub">Yearly growth rate of an investment.</p>
  <div class="fld"><label for="cgI">INITIAL VALUE (₹)</label><input id="cgI" type="number" inputmode="decimal" min="0" step="any" value="100000"></div><div class="fld"><label for="cgF">FINAL VALUE (₹)</label><input id="cgF" type="number" inputmode="decimal" min="0" step="any" value="250000"></div><div class="fld"><label for="cgY">YEARS</label><input id="cgY" type="number" inputmode="decimal" min="0" step="any" value="5"></div></div>
  <div class="app-card glass-card result"><div class="big-result"><small>CAGR (per year)</small><strong id="cgBig">0</strong></div><div class="kv"><div><span>Total gain</span><b id="cgGain">—</b></div><div><span>Absolute return</span><b id="cgAbs">—</b></div><div><span>Growth multiple</span><b id="cgMult">—</b></div></div><p class="note">CAGR assumes smooth growth. It ignores ups and downs during the period.</p></div>
</div></div>
