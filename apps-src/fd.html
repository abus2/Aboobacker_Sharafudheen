<div class="app-panel" id="fd" role="tabpanel"><div class="app-grid">
        <div class="app-card glass-card"><h2>FD &amp; RD Maturity</h2><p class="sub">Fixed deposit (lump sum) or recurring deposit (monthly).</p>
          <div class="fld"><label>TYPE</label><div class="seg" id="fdType"><button type="button" class="active" data-t="fd">Fixed Deposit</button><button type="button" data-t="rd">Recurring Deposit</button></div></div>
          <div class="fld"><label for="fdAmt" id="fdAmtLabel">DEPOSIT AMOUNT (₹)</label><input id="fdAmt" type="number" inputmode="decimal" min="0" step="any" value="100000"></div>
          <div class="fld"><label for="fdRate">INTEREST RATE (% p.a.)</label><input id="fdRate" type="number" inputmode="decimal" min="0" max="30" step="0.05" value="7"></div>
          <div class="fld"><label for="fdYears">PERIOD (years)</label><input id="fdYears" type="number" min="0.25" max="30" step="0.25" value="5"></div>
          <p class="note">Assumes quarterly compounding, which is common for bank deposits. Your bank’s exact method and tax treatment may differ.</p></div>
        <div class="app-card glass-card result"><div class="big-result"><small>MATURITY AMOUNT</small><strong id="fdBig">₹0</strong></div>
          <div class="kv"><div><span id="fdInvLabel">Amount deposited</span><b id="fdInv">₹0</b></div><div><span>Interest earned</span><b id="fdInt">₹0</b></div><div><span>Total growth</span><b id="fdGrowth">0%</b></div></div>
          <div class="bar-split" aria-hidden="true"><i class="a" id="fdBarA" style="width:70%"></i><i class="b" id="fdBarB" style="width:30%"></i></div>
          <div class="legend"><span>Deposited</span><span class="b">Interest</span></div></div>
      </div></div>
