<div class="app-panel" id="eligibility" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Loan Eligibility</h2><p class="sub">Estimate the loan you may qualify for from your income.</p>
  <div class="fld"><label for="elI">MONTHLY INCOME (₹)</label><input id="elI" type="number" inputmode="decimal" min="0" step="any" value="60000"></div><div class="fld"><label for="elE">EXISTING EMIs / MONTH (₹)</label><input id="elE" type="number" inputmode="decimal" min="0" step="any" value="5000"></div><div class="add-row"><div class="fld"><label for="elR">RATE (% p.a.)</label><input id="elR" type="number" inputmode="decimal" min="0" step="any" value="9"></div><div class="fld"><label for="elY">YEARS</label><input id="elY" type="number" inputmode="decimal" min="0" step="any" value="15"></div></div><div class="fld"><label for="elF">MAX % OF INCOME FOR EMIs</label><input id="elF" type="number" inputmode="decimal" min="0" step="any" value="50"></div></div>
  <div class="app-card glass-card result"><div class="big-result"><small>ESTIMATED ELIGIBLE LOAN</small><strong id="elBig">0</strong></div><div class="kv"><div><span>EMI you can afford</span><b id="elEmi">—</b></div><div><span>Total payment</span><b id="elTot">—</b></div><div><span>Total interest</span><b id="elInt">—</b></div></div><p class="note">An estimate only. Banks also check credit score, age, job type and property value. Many lenders use 40–55% of income as the limit.</p></div>
</div></div>
