<div class="app-panel" id="amort" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Loan Amortization Schedule</h2><p class="sub">See how each year's EMI splits into principal and interest, and the balance still owed.</p>
  <div class="fld"><label for="amP">LOAN AMOUNT (₹)</label><input id="amP" type="number" inputmode="decimal" min="0" step="any" value="2000000"></div>
  <div class="add-row"><div class="fld"><label for="amR">INTEREST RATE (% per year)</label><input id="amR" type="number" inputmode="decimal" min="0" max="60" step="any" value="9"></div><div class="fld"><label for="amY">TENURE (years)</label><input id="amY" type="number" inputmode="decimal" min="1" max="40" step="1" value="10"></div></div>
  <p class="note">Monthly reducing-balance method. Bank schedules may differ slightly because of rounding and payment dates.</p></div>
  <div class="app-card glass-card result"><div class="big-result"><small>MONTHLY EMI</small><strong id="amBig">₹0</strong></div>
  <div class="kv"><div><span>Total interest</span><b id="amInt">₹0</b></div><div><span>Total payment</span><b id="amTot">₹0</b></div></div>
  <div class="kv" id="amTable"></div></div>
</div></div>
