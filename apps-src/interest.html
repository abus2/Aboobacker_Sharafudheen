<div class="app-panel" id="interest" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Simple &amp; Compound Interest</h2><p class="sub">Compare interest earned with the simple and compound methods.</p>
  <div class="fld"><label for="inP">PRINCIPAL (₹)</label><input id="inP" type="number" inputmode="decimal" min="0" step="any" value="100000"></div><div class="add-row"><div class="fld"><label for="inR">RATE (% p.a.)</label><input id="inR" type="number" inputmode="decimal" min="0" step="any" value="8"></div><div class="fld"><label for="inY">YEARS</label><input id="inY" type="number" inputmode="decimal" min="0" step="any" value="5"></div></div><div class="fld"><label for="inN">COMPOUNDING</label><select id="inN"><option value="1">Yearly</option><option value="2">Half-yearly</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option></select></div></div>

</div></div>
