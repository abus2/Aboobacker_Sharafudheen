<div class="app-panel" id="utm" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>UTM Link Builder</h2><p class="sub">Add campaign tracking tags to a link so Google Analytics shows where visitors came from.</p>
  <div class="fld"><label for="utUrl">WEBSITE URL</label><input id="utUrl" type="text" placeholder="https://example.com/offer" value="https://example.com/offer"></div>
  <div class="add-row"><div class="fld"><label for="utSrc">SOURCE *</label><input id="utSrc" type="text" placeholder="instagram" value="instagram"></div><div class="fld"><label for="utMed">MEDIUM *</label><input id="utMed" type="text" placeholder="social" value="social"></div></div>
  <div class="fld"><label for="utCmp">CAMPAIGN *</label><input id="utCmp" type="text" placeholder="diwali_sale" value="diwali_sale"></div>
  <div class="add-row"><div class="fld"><label for="utTerm">TERM (optional)</label><input id="utTerm" type="text" placeholder="paid keyword"></div><div class="fld"><label for="utCnt">CONTENT (optional)</label><input id="utCnt" type="text" placeholder="story_ad_a"></div></div>
  <p class="note">* Required. Spaces become underscores in the tag values; use lowercase for cleaner reports.</p></div>
  <div class="app-card glass-card result"><div class="big-result"><small>YOUR TRACKED LINK</small><strong id="utOut" style="font-size:14px;line-height:1.5;word-break:break-all;font-weight:600">—</strong></div>
  <div class="copy-row"><button type="button" id="utCopy">⧉ Copy link</button></div></div>
</div></div>
