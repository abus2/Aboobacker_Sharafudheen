<div class="app-panel" id="budget" role="tabpanel"><div class="app-grid">
        <div class="app-card glass-card"><h2>Budget &amp; Expense Tracker</h2><p class="sub">Entries are saved only in this browser on this device.</p>
          <form id="bgForm" novalidate>
            <div class="fld"><label>TYPE</label><div class="seg" id="bgType"><button type="button" class="active" data-type="expense">Expense</button><button type="button" data-type="income">Income</button></div></div>
            <div class="add-row"><div class="fld"><label for="bgAmt">AMOUNT (₹)</label><input id="bgAmt" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
            <div class="fld"><label for="bgCat">CATEGORY</label><select id="bgCat"><option>Food</option><option>Travel</option><option>Study</option><option>Bills</option><option>Shopping</option><option>Health</option><option>Entertainment</option><option>Other</option></select></div></div>
            <div class="fld"><label for="bgNote">NOTE (optional)</label><input id="bgNote" type="text" maxlength="60" placeholder="e.g. Lunch with friends"></div>
            <button class="button button-primary" type="submit">Add entry <span>＋</span></button>
          </form>
          <div class="copy-row" style="margin-top:18px"><button type="button" id="bgCsv">⇩ Export CSV</button><button type="button" id="bgClear">Clear all</button></div></div>
        <div class="app-card glass-card result"><div class="big-result" id="bgBigBox"><small>BALANCE</small><strong id="bgBal">₹0</strong></div>
          <div class="kv"><div><span>Income</span><b id="bgInc">₹0</b></div><div><span>Expenses</span><b id="bgExp">₹0</b></div><div><span>Savings rate</span><b id="bgSave">—</b></div></div>
          <div><p class="note" style="margin-bottom:10px;letter-spacing:1.6px;font-weight:700">WHERE MONEY GOES</p><div id="bgCats"></div></div>
          <div><p class="note" style="margin-bottom:10px;letter-spacing:1.6px;font-weight:700">ENTRIES</p><div class="entry-list" id="bgList"></div></div></div>
      </div></div>
