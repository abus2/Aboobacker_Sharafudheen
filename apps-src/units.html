<div class="app-panel" id="units" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Unit Converter</h2><p class="sub">Convert between common units.</p>
  <div class="fld"><label for="unCat">TYPE</label><select id="unCat"></select></div><div class="fld"><label for="unVal">VALUE</label><input id="unVal" type="number" inputmode="decimal" min="0" step="any" value="1"></div><div class="add-row"><div class="fld"><label for="unFrom">FROM</label><select id="unFrom"></select></div><div class="fld"><label for="unTo">TO</label><select id="unTo"></select></div></div></div>
  <div class="app-card glass-card result"><div class="big-result"><small>RESULT</small><strong id="unBig">0</strong></div><div class="kv"><div><span>Conversion</span><b id="unText">—</b></div><div><span>Reverse</span><b id="unRev">—</b></div></div></div>
</div></div>
