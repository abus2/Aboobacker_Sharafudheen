<div class="app-panel" id="bmi" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>BMI Calculator</h2><p class="sub">Body mass index from weight and height (adults).</p>
  <div class="add-row"><div class="fld"><label for="bmW">WEIGHT (kg)</label><input id="bmW" type="number" inputmode="decimal" min="0" step="any" value="70"></div><div class="fld"><label for="bmH">HEIGHT (cm)</label><input id="bmH" type="number" inputmode="decimal" min="0" step="any" value="170"></div></div></div>
  <div class="app-card glass-card result"><div class="big-result"><small>YOUR BMI</small><strong id="bmBig">0</strong></div><div class="kv"><div><span>Category</span><b id="bmCat">—</b></div><div><span>Healthy weight range</span><b id="bmRange">—</b></div><div><span>To reach healthy range</span><b id="bmDiff">—</b></div></div><p class="note">BMI is a general screening number, not a diagnosis. It does not account for muscle, age or body type. Ask a doctor for health advice.</p></div>
</div></div>
