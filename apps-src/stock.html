<div class="app-panel" id="stock" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Stock Register</h2><p class="sub">Track items, quantity and value. Saved only in this browser.</p>
  <div class="fld"><label for="skN">ITEM NAME</label><input id="skN" type="text" maxlength="40" placeholder="e.g. Rice 1kg" value=""></div><div class="add-row"><div class="fld"><label for="skQ">QUANTITY</label><input id="skQ" type="number" inputmode="decimal" min="0" step="any" value="10"></div><div class="fld"><label for="skU">UNIT</label><input id="skU" type="text" maxlength="8" value="pcs"></div></div><div class="add-row"><div class="fld"><label for="skC">COST PRICE / UNIT (₹)</label><input id="skC" type="number" inputmode="decimal" min="0" step="any" value="40"></div><div class="fld"><label for="skS">SELLING PRICE / UNIT (₹)</label><input id="skS" type="number" inputmode="decimal" min="0" step="any" value="50"></div></div><button class="button" type="button" id="skAdd">Add item ＋</button><div class="copy-row" style="margin-top:16px"><button type="button" id="skClear">Clear all</button></div></div>
  <div class="app-card glass-card result"><div class="big-result"><small>STOCK VALUE (AT COST)</small><strong id="skBig">0</strong></div><div class="kv"><div><span>Items</span><b id="skCnt">—</b></div><div><span>Stock value at selling price</span><b id="skSell">—</b></div><div><span>Potential profit</span><b id="skProfit">—</b></div></div><div class="entry-list" id="skList"></div></div>
</div></div>
