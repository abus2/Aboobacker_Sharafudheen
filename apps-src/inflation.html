<div class="app-panel" id="inflation" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Inflation Calculator</h2><p class="sub">What costs will look like in the future, and what money will be worth.</p>
  <div class="fld"><label for="ifA">AMOUNT TODAY (₹)</label><input id="ifA" type="number" inputmode="decimal" min="0" step="any" value="100000"></div><div class="add-row"><div class="fld"><label for="ifR">INFLATION (% p.a.)</label><input id="ifR" type="number" inputmode="decimal" min="0" step="any" value="6"></div><div class="fld"><label for="ifY">YEARS</label><input id="ifY" type="number" inputmode="decimal" min="0" step="any" value="10"></div></div></div>
  <div class="app-card glass-card result"><div class="big-result"><small>SAME THINGS WILL COST</small><strong id="ifBig">0</strong></div><div class="kv"><div><span>Extra cost due to inflation</span><b id="ifExtra">—</b></div><div><span>Today's money will buy only</span><b id="ifWorth">—</b></div><div><span>Loss of buying power</span><b id="ifLoss">—</b></div></div><p class="note">Uses a constant inflation rate. Real inflation changes every year.</p></div>
</div></div>
