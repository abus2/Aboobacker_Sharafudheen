<div class="app-panel" id="marketing" role="tabpanel"><div class="app-grid">
  <div class="app-card glass-card"><h2>Ad Campaign Metrics</h2><p class="sub">CTR, CPC, CPM, conversion rate, CPA, ROAS and ROI from your campaign numbers.</p>
  <div class="add-row"><div class="fld"><label for="mkSpend">AD SPEND (₹)</label><input id="mkSpend" type="number" inputmode="decimal" min="0" step="any" value="10000"></div><div class="fld"><label for="mkRev">REVENUE EARNED (₹)</label><input id="mkRev" type="number" inputmode="decimal" min="0" step="any" value="35000"></div></div>
  <div class="add-row"><div class="fld"><label for="mkImp">IMPRESSIONS</label><input id="mkImp" type="number" inputmode="numeric" min="0" step="1" value="200000"></div><div class="fld"><label for="mkClk">CLICKS</label><input id="mkClk" type="number" inputmode="numeric" min="0" step="1" value="4000"></div></div>
  <div class="fld"><label for="mkConv">CONVERSIONS (sales / leads)</label><input id="mkConv" type="number" inputmode="numeric" min="0" step="1" value="120"></div></div>
  <div class="app-card glass-card result"><div class="big-result profit"><small>ROAS (return on ad spend)</small><strong id="mkBig">0×</strong></div>
  <div class="kv"><div><span>CTR (click-through rate)</span><b id="mkCTR">—</b></div><div><span>CPC (cost per click)</span><b id="mkCPC">—</b></div><div><span>CPM (cost per 1,000 views)</span><b id="mkCPM">—</b></div><div><span>Conversion rate</span><b id="mkCR">—</b></div><div><span>CPA (cost per conversion)</span><b id="mkCPA">—</b></div><div><span>ROI</span><b id="mkROI">—</b></div></div></div>
</div></div>
