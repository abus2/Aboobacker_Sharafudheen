<div class="app-panel" id="breakeven" role="tabpanel"><div class="app-grid">
        <div class="app-card glass-card"><h2>Break-even Calculator</h2><p class="sub">How many units must you sell to cover your costs?</p>
          <div class="fld"><label for="beFixed">FIXED COSTS (₹ per month / period)</label><input id="beFixed" type="number" inputmode="decimal" min="0" step="any" value="50000"></div>
          <div class="add-row"><div class="fld"><label for="bePrice">SELLING PRICE / UNIT (₹)</label><input id="bePrice" type="number" inputmode="decimal" min="0" step="any" value="500"></div>
          <div class="fld"><label for="beVar">VARIABLE COST / UNIT (₹)</label><input id="beVar" type="number" inputmode="decimal" min="0" step="any" value="300"></div></div>
          <div class="add-row"><div class="fld"><label for="beTarget">TARGET PROFIT (₹, optional)</label><input id="beTarget" type="number" inputmode="decimal" min="0" step="any" value="20000"></div>
          <div class="fld"><label for="beExpected">EXPECTED SALES (units)</label><input id="beExpected" type="number" min="0" step="1" value="400"></div></div>
          <p class="note">Break-even units = fixed costs ÷ (selling price − variable cost).</p></div>
        <div class="app-card glass-card result"><div class="big-result" id="beBigBox"><small>BREAK-EVEN UNITS</small><strong id="beBig">0</strong></div>
          <div class="kv"><div><span>Contribution per unit</span><b id="beContrib">₹0</b></div><div><span>Contribution margin</span><b id="beCm">0%</b></div><div><span>Break-even sales value</span><b id="beSales">₹0</b></div><div><span>Units for target profit</span><b id="beTargetUnits">0</b></div><div><span>Margin of safety (expected sales)</span><b id="beMos">—</b></div></div></div>
      </div></div>
